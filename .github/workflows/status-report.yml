name: 飞书项目状态日报
on:
  schedule:
    - cron: '0 10 * * *' # 北京时间 18:00；独立于每日阅读开关
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/status-report.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: weread-status-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
      WEREAD_ENABLED: ${{ vars.WEREAD_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 安装依赖（无需浏览器）
        run: python -m pip install -r requirements.lock.txt
      - name: 查询运行状态并发送飞书日报
        run: python -m weread.status_report
