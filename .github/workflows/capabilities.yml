name: 官方能力只读核实
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/capabilities.yml']
permissions:
  contents: read
concurrency:
  group: weread-account
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      WEREAD_SESSION_KEY: ${{ secrets.WEREAD_SESSION_KEY }}
      WEREAD_INITIAL_STATE: ${{ secrets.WEREAD_INITIAL_STATE }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.data/browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: |
          python -m pip install -r requirements.lock.txt
          python -m playwright install --with-deps chromium
          echo "WEREAD_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: .data/cloud/session.enc
          key: capability-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            weread-session-v1-main-
      - run: python -m weread.capabilities
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-capabilities
          path: reports/capabilities.json
          retention-days: 7
