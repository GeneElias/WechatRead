name: 每日微信读书

on:
  schedule:
    - cron: '17 1 * * *' # 北京时间 09:17，GitHub 调度可能延迟
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weread-account
  cancel-in-progress: false

jobs:
  read:
    # 在完成首次手动验证后设置仓库变量 WEREAD_ENABLED=true。
    if: github.event_name == 'workflow_dispatch' || vars.WEREAD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      WEREAD_SESSION_KEY: ${{ secrets.WEREAD_SESSION_KEY }}
      WEREAD_INITIAL_STATE: ${{ secrets.WEREAD_INITIAL_STATE }}
      WEREAD_BOOK_URL: ${{ vars.WEREAD_BOOK_URL }}
      # 使用 Playwright 下载的配套 Chromium，忽略 runner 上可能存在的系统版本。
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.data/browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 检查部署配置
        run: |
          python - <<'PY'
          import os
          required = ('WEREAD_SESSION_KEY', 'WEREAD_INITIAL_STATE', 'WEREAD_BOOK_URL')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('缺少配置名称：' + ', '.join(missing))
          PY
      - name: 安装依赖与浏览器
        run: |
          python -m pip install -r requirements.lock.txt
          python -m playwright install --with-deps chromium
          echo "WEREAD_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: 恢复加密登录态
        id: session
        uses: actions/cache/restore@v4
        with:
          path: .data/cloud/session.enc
          key: weread-session-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            weread-session-v1-${{ github.ref_name }}-
      - name: 执行阅读并核验结果
        run: python -m weread.cloud run
      - name: 保存刷新后的加密登录态
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .data/cloud/session.enc
          key: weread-session-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保存本次结果（不含登录态）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weread-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
