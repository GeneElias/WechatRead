name: 会话与阅读证据复核
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/session-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
      WEREAD_SESSION_KEY: ${{ secrets.WEREAD_SESSION_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 安装依赖
        run: |
          python -m pip install -r requirements.lock.txt
          python -m playwright install --with-deps chromium
          echo "WEREAD_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: 恢复加密会话缓存（不写回）
        uses: actions/cache/restore@v4
        with:
          path: .data/cloud/session.enc
          key: session-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            weread-session-v1-main-
      - name: 获取最近成功实测的结果
        run: |
          verified_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow feishu-login-test.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$verified_run" && test "$verified_run" != "null"
          gh run download "$verified_run" --repo "$GITHUB_REPOSITORY" --pattern 'weread-result-*' --dir "$RUNNER_TEMP/weread-prior-results"
      - name: 只读复核登录与阅读记录
        run: python -m weread.verify_session --previous-reports "$RUNNER_TEMP/weread-prior-results"
