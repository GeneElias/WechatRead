name: 飞书与登录页诊断
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 安装诊断依赖
        run: |
          python -m pip install -r requirements.lock.txt
          python -m playwright install --with-deps chromium
          echo "WEREAD_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: 测试飞书与官网（无登录凭据输出）
        run: python -m weread.diagnose
