name: 飞书扫码实测
# 实测飞书卡片内的可扫码二维码；同名实测替换旧任务。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/feishu-login-test.yml']
permissions:
  contents: read
jobs:
  login-and-read:
    uses: ./.github/workflows/daily-read.yml
    with:
      login_test: true
    secrets: inherit
