name: 飞书扫码实测
# 动态登录修复实测；使用调用方工作流名称取消旧测试，避免排队等待过期二维码。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/feishu-login-test.yml']
permissions:
  contents: read
jobs:
  login-and-read:
    uses: ./.github/workflows/daily-read.yml
    with:
      login_test: true
    secrets: inherit
