name: 飞书扫码实测
# 在机器人配置完成后触发一次实测，并保留不含凭据的阶段诊断。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/feishu-login-test.yml']
permissions:
  contents: read
jobs:
  login-and-read:
    uses: ./.github/workflows/daily-read.yml
    with:
      login_test: true
    secrets: inherit
