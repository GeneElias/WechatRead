name: 飞书扫码实测
# 恢复暂停后的扫码实测；同名实测替换旧任务，结果记录仅包含状态。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/feishu-login-test.yml']
permissions:
  contents: read
jobs:
  login-and-read:
    uses: ./.github/workflows/daily-read.yml
    with:
      login_test: true
    secrets: inherit
